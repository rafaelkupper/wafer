name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    strategy:
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select Xcode 26
        run: |
          developer_dir=$(scripts/select-xcode.sh)
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
      - name: Show toolchain
        id: toolchain
        run: |
          xcodebuild -version
          swift --version
          toolchain_hash=$( { xcodebuild -version; swift --version; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "hash=$toolchain_hash" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ matrix.configuration }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ matrix.configuration }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Package.resolved') }}-
      - name: Check sources and tooling
        run: scripts/check.sh ${{ matrix.configuration == 'release' && '--release' || '' }}
      - name: Assemble app
        if: matrix.configuration == 'debug'
        run: scripts/build-app.sh release
      - name: Verify Quick Look extension
        if: matrix.configuration == 'debug'
        run: scripts/verify-appex.sh build/Wafer.app
